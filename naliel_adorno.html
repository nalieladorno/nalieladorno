<head>

<title>Naliel Adorno · Identidade Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0a1f2f;
    --gold: #d3b17e;
    --gold-light: rgba(211,177,126,0.18);
    --gold-border: rgba(211,177,126,0.3);
    --white: #ffffff;
    --muted: rgba(255,255,255,0.45);
    --link-bg: rgba(255,255,255,0.06);
    --link-hover: rgba(211,177,126,0.12);
  }
  html, body {
    min-height: 100vh;
    background: #081624;
    font-family: 'Outfit', sans-serif;
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(211,177,126,0.08), transparent),
      radial-gradient(ellipse 60% 60% at 80% 80%, rgba(10,31,47,0.9), transparent);
    z-index: 0;
    pointer-events: none;
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--navy);
    border: 0.5px solid var(--gold-border);
    border-radius: 28px;
    padding: 2.5rem 2rem 2.5rem;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(211,177,126,0.06) inset;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(211,177,126,0.09), transparent 70%);
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(211,177,126,0.05), transparent 70%);
    pointer-events: none;
  }
  /* Avatar */
  .avatar-wrap {
    position: relative;
    width: 84px; height: 84px;
    margin-bottom: 1.4rem;
  }
  .avatar-ring {
    position: absolute; inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(211,177,126,0.7), rgba(211,177,126,0.1) 60%, rgba(211,177,126,0.7));
    z-index: 0;
  }
  .avatar {
    position: relative; z-index: 1;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 3px solid var(--navy);
    object-fit: cover;
    display: block;
  }
  /* Text */
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.02em;
    margin-bottom: 3px;
    line-height: 1.2;
  }
  .role {
    font-size: 13px;
    font-weight: 400;
    color: var(--gold);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 2px;
    opacity: 0.9;
  }
  .company {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .location {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 2rem;
  }
  .location svg { width: 12px; height: 12px; flex-shrink: 0; }
  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(211,177,126,0.4) 40%, rgba(211,177,126,0.4) 60%, transparent 100%);
    margin-bottom: 1.5rem;
  }
  /* Links */
  .links { display: flex; flex-direction: column; gap: 11px; position: relative; z-index: 1; }
  .link-btn {
    display: flex; align-items: center; gap: 14px;
    background: var(--link-bg);
    border: 0.5px solid var(--gold-border);
    border-radius: 14px; padding: 13px 16px;
    color: #fff; text-decoration: none;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    transition: background 0.18s, border-color 0.18s, transform 0.12s;
    cursor: pointer;
  }
  .link-btn:hover {
    background: var(--link-hover);
    border-color: rgba(211,177,126,0.5);
    transform: translateX(2px);
  }
  .link-btn:active { transform: scale(0.98); }
  .link-btn.highlight {
    background: rgba(211,177,126,0.1);
    border-color: rgba(211,177,126,0.45);
  }
  .link-btn.highlight:hover { background: rgba(211,177,126,0.18); }
  .icon-wrap {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap svg { width: 18px; height: 18px; }
  .icon-wa  { background: rgba(74,222,128,0.12); }
  .icon-ig  { background: rgba(244,114,182,0.12); }
  .icon-pf  { background: rgba(211,177,126,0.14); }
  .icon-loc { background: rgba(211,177,126,0.08); }
  .link-text { flex: 1; }
  .link-title { font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.92); }
  .link-sub { font-size: 11.5px; color: rgba(255,255,255,0.38); margin-top: 1px; display: block; }
  .link-btn.highlight .link-sub { color: rgba(211,177,126,0.6); }
  .arrow { color: rgba(211,177,126,0.4); font-size: 18px; font-weight: 300; }
  /* Footer */
  .footer {
    margin-top: 2rem;
    text-align: center;
    font-size: 11px;
    color: rgba(211,177,126,0.2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    position: relative; z-index: 1;
  }
  /* Fade-in */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeUp 0.6s ease both; }
  .link-btn:nth-child(1) { animation: fadeUp 0.5s 0.15s ease both; }
  .link-btn:nth-child(2) { animation: fadeUp 0.5s 0.22s ease both; }
  .link-btn:nth-child(3) { animation: fadeUp 0.5s 0.29s ease both; }
  .link-btn:nth-child(4) { animation: fadeUp 0.5s 0.36s ease both; }
</style>
</head>
